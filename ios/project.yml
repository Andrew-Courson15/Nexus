# NEXUS for iPhone. Make the Xcode project from this file with XcodeGen (on a Mac):
#   brew install xcodegen && cd ios && xcodegen
# then open ios/NEXUS.xcodeproj in Xcode. See IOS.md.
name: NEXUS
options:
  bundleIdPrefix: local.nexus
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "0.15.1"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""  # your Apple team (Xcode → Signing & Capabilities)
targets:
  NEXUS:
    type: application
    platform: iOS
    scheme: {}
    sources:
      - path: NEXUS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.nexus.app  # change to your own, e.g. com.yourname.nexus
        TARGETED_DEVICE_FAMILY: "1"  # iPhone (it also runs on an iPad, in iPhone size)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: NEXUS
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_NSCameraUsageDescription: "NEXUS uses the camera to scan your computer's NEXUS QR code and to photograph sketches you capture."
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "NEXUS uses the microphone to record voice notes you capture."
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
    info:
      path: NEXUS/Info.plist
      properties:
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true  # a NEXUS on this Wi-Fi (Tailscale addresses use HTTPS)
