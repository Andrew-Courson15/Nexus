<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>NEXUS</title>
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#0f1114">
  <!-- Installable on phones ("Add to Home Screen") -->
  <link rel="manifest" href="/static/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="NEXUS">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='none' stroke='%23f2b84b' stroke-width='3'/%3E%3Ccircle cx='16' cy='16' r='4' fill='%23f2b84b'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/css/style.css?v={{ version }}">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/" aria-label="NEXUS home">
      <span class="brand-mark" aria-hidden="true"></span><span class="brand-text">NEXUS</span>
    </a>
    <button id="outbox" class="outbox" type="button" hidden aria-live="polite"></button>
    <nav class="nav" aria-label="Main">
      <a href="#/today" data-nav="today">Today</a>
      <a href="#/archive" data-nav="archive" class="wide-only">Creative Archive</a>
      <a href="#/projects" data-nav="projects">Projects</a>
      <a href="#/ideas" data-nav="ideas" class="wide-only">Ideas</a>
      <a href="#/art" data-nav="art" class="wide-only">Art</a>
      <a href="#/search" data-nav="search" class="wide-only">Search</a>
      <a href="#/settings" data-nav="settings">Settings</a>
    </nav>
  </header>

  <div id="offline-bar" class="offline-bar" role="status" hidden></div>

  <main id="view" class="view" tabindex="-1">
    <noscript><p class="empty">NEXUS needs JavaScript enabled in your browser.</p></noscript>
  </main>

  <!-- Phone tab bar (shown on small screens only) -->
  <nav class="tabbar" aria-label="Main">
    <a href="#/" data-nav=""><span class="ti" aria-hidden="true">＋</span>Capture</a>
    <a href="#/archive" data-nav="archive"><span class="ti" aria-hidden="true">▦</span>Archive</a>
    <a href="#/ideas" data-nav="ideas"><span class="ti" aria-hidden="true">✦</span>Ideas</a>
    <a href="#/art" data-nav="art"><span class="ti" aria-hidden="true">✎</span>Art</a>
    <a href="#/search" data-nav="search"><span class="ti" aria-hidden="true">⌕</span>Search</a>
  </nav>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="/static/js/app.js?v={{ version }}"></script>
</body>
</html>
